{
  "agents_description": "Three separate agent invocations with fresh contexts. This section documents the roles; runner.py selects them and mcp/server.py enforces permissions.",
  "agents": {
    "coder": {
      "purpose": "Implement and repair the browser port",
      "prompt": "loop/prompts/coder.md",
      "permissions": "Read allowed source and current-run evidence; edit only permitted port source in platform/ and web/; submit a handoff. No arbitrary command execution or protected-file edits."
    },
    "reviewer": {
      "purpose": "Independently inspect code and report defects",
      "prompt": "loop/prompts/reviewer.md",
      "permissions": "Read allowed source and current-run evidence; submit PASS or FAIL. Cannot edit source or execute commands."
    },
    "tester": {
      "purpose": "Independently run protected verification and report evidence",
      "prompt": "loop/prompts/tester.md",
      "permissions": "Read allowed source and current-run evidence; run the fixed build/test verification tool; submit PASS or FAIL. Cannot edit source or tests."
    }
  },
  "model": "sonnet",
  "max_retries": 3,
  "max_turns_per_agent": 20,
  "max_budget_usd_per_agent": 2.0,
  "max_budget_usd_per_run": 30.0,
  "max_seconds_per_agent": 600,
  "max_seconds_per_run": 3600,
  "tasks": [
    {"id": "build", "description": "Inspect the supplied Emscripten 4.0.18 build and verify the browser port builds. Build configuration is human-owned; report required changes instead of bypassing permissions."},
    {"id": "rendering", "description": "Verify and repair browser framebuffer rendering and continuous simulation."},
    {"id": "input", "description": "Verify and repair movement, turning, shooting, key release and browser controls."},
    {"id": "wad", "description": "Verify supplied shareware WAD loading and sound/music integration."},
    {"id": "integration", "description": "Review the entire port and run all protected acceptance checks. Report uncovered gameplay and system-evaluation requirements honestly."}
  ]
}
